slam_toolbox:
  ros__parameters:
    mode: mapping
    map_frame: map
    odom_frame: odom
    base_frame: base_footprint
    scan_topic: /scan
    resolution: 0.05
    map_update_interval: 1.0
    transform_publish_period: 0.02
    transform_timeout: 0.2
    scan_queue_size: 1
    min_laser_range: 0.06
    max_laser_range: 10.0
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.12
    minimum_travel_heading: 0.12
    # The concentric walls weakly constrain motion along the lane. Keep local
    # scan matching near the simulated wheel/IMU odometry prediction.
    correlation_search_space_dimension: 0.18
    correlation_search_space_smear_deviation: 0.025
    coarse_search_angle_offset: 0.10
    distance_variance_penalty: 0.05
    angle_variance_penalty: 0.05
    use_response_expansion: false
    # At the first return, only a short chain exists beyond the start.
    loop_search_maximum_distance: 2.0
    loop_search_space_dimension: 2.0
    loop_match_minimum_chain_size: 5
    loop_match_minimum_response_coarse: 0.40
    loop_match_minimum_response_fine: 0.50
    do_loop_closing: true
    use_map_saver: true
    enable_interactive_mode: false
